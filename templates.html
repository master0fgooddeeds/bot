<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTC Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px;
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
        }
        h1 { font-size: 22px; margin-bottom: 15px; text-align: center; }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
        }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; }
        .stat-label { color: var(--tg-theme-hint-color, #8e8e93); }
        .stat-value { font-weight: bold; }
        canvas { max-height: 250px; }
    </style>
</head>
<body>
    <h1>📊 MTC Dashboard</h1>
    
    <div class="card">
        <div class="stat-row"><span class="stat-label">Всего сделок:</span><span class="stat-value" id="total">0</span></div>
        <div class="stat-row"><span class="stat-label">Винрейт:</span><span class="stat-value" id="winrate">0%</span></div>
        <div class="stat-row"><span class="stat-label">Чистый PnL:</span><span class="stat-value" id="pnl">0%</span></div>
    </div>

    <div class="card">
        <canvas id="myChart"></canvas>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        fetch('/api/stats')
            .then(response => response.json())
            .then(data => {
                document.getElementById('total').innerText = data.total;
                document.getElementById('winrate').innerText = data.winrate + '%';
                document.getElementById('pnl').innerText = data.pnl + '%';

                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['TP (Победы)', 'SL (Поражения)', 'Прочее'],
                        datasets: [{
                            data: [data.wins, data.losses, data.skipped + data.expired],
                            backgroundColor: ['#00e676', '#ff003c', '#7a7a7a'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { color: tg.themeParams.text_color || '#ffffff' } }
                        }
                    }
                });
            })
            .catch(err => console.error('Ошибка:', err));
    </script>
</body>
</html>
